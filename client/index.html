<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch and home indicator;
         the CSS pads content back with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>EliaVit — Sales Record</title>
    <meta name="description" content="Pharmaceutical field-sales record app for medical representatives and their managers." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6c4cf1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131126" media="(prefers-color-scheme: dark)" />

    <!-- iOS home-screen app: full screen, no Safari chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EliaVit" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />

    <!-- iOS Safari can dial phone numbers itself; stop it reformatting our data. -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
